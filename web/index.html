<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador IA + NFT Solana</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@solana/web3.js@latest/lib/index.iife.min.js"></script>
    <!-- Umi y Metaplex para NFT (simplificado, usa CDN o npm en prod) -->
    <script src="https://unpkg.com/@metaplex-foundation/umi@0.9.2/dist/index.js"></script>
    <!-- Phantom wallet adapter -->
    <script src="https://unpkg.com/@solana/wallet-adapter-base@0.9.23/dist/umd/index.js"></script>
</head>
<body class="bg-gradient-to-br from-purple-900 to-blue-900 min-h-screen text-white p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-4xl font-bold text-center mb-12">🎨 IA Gen → NFT Solana</h1>
        
        <!-- Sección 1: Generación Imagen -->
        <section class="bg-white/10 backdrop-blur-lg rounded-2xl p-8 mb-12">
            <h2 class="text-2xl font-bold mb-8">Generar Imagen con IA</h2>
            
            <div class="grid md:grid-cols-2 gap-6 mb-8">
                <div>
                    <label class="block text-sm font-medium mb-2">Prompt Positivo</label>
                    <input id="prompt" type="text" placeholder="Escriba su prompt aquí: Ej. Un gato astronauta en Marte" 
                           class="w-full p-4 bg-white/20 rounded-xl border border-white/30 focus:border-blue-400 focus:outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-2">Prompt Negativo (Opcional)</label>
                    <input id="negPrompt" type="text" placeholder="Opcional. Ej. borroso, feo, deformado, baja calidad" 
                           class="w-full p-4 bg-white/20 rounded-xl border border-white/30 focus:border-blue-400 focus:outline-none">
                </div>
            </div>
            
            <div class="grid md:grid-cols-3 gap-6 mb-8">
                <div>
                    <label class="block text-sm font-medium mb-2">Estilo</label>
                    <select id="style" class="w-full p-4 bg-white/20 rounded-xl border border-white/30">
                        <option value="realistic">Realista</option>
                        <option value="anime">Anime</option>
                        <option value="cyberpunk">Cyberpunk</option>
                        <option value="pixelart">Pixel Art</option>
                        <option value="2D">Ilustración 2D</option>
                        <option value="oil">Óleo</option>
                    </select>
                </div>
                <div>
                    <!--Cambiar la cantidad de pasos, lo he dejado entre 10. y 50-->
                    <label class="block text-sm font-medium mb-2">Pasos</label>
                    <input id="steps" type="range" min="10" max="50" value="20" 
                           class="w-full h-3 bg-white/20 rounded-lg appearance-none cursor-pointer">
                    <span id="stepsValue" class="text-sm">20</span>
                </div>
                <div class="flex items-end">
                    <button id="generateBtn" class="w-full bg-gradient-to-r from-blue-500 to-purple-600 hover:from-blue-600 hover:to-purple-700 px-8 py-4 rounded-xl font-bold text-lg transition-all duration-300">
                        🎨 Generar Imagen
                    </button>
                </div>
            </div>
            
            <div id="imageResult" class="hidden bg-white/10 rounded-xl p-6 text-center">
                <img id="generatedImg" class="max-w-md max-h-96 mx-auto rounded-lg shadow-2xl" alt="Imagen generada">
                <p class="mt-4 text-sm opacity-75">¡Imagen lista para NFT!</p>
            </div>
        </section>

        <!-- Sección 2: Convertir a NFT -->
        <section id="nftSection" class="bg-white/10 backdrop-blur-lg rounded-2xl p-8 hidden">
            <h2 class="text-2xl font-bold mb-8">🔗 Convertir en NFT Solana</h2>
            
            <div class="mb-8">
                <button id="connectWallet" class="bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 px-8 py-4 rounded-xl font-bold mb-4 transition-all duration-300">
                    💳 Conectar Wallet (Phantom)
                </button>
                <p id="walletStatus" class="text-sm opacity-75">No conectado</p>
            </div>
            
            <div class="grid md:grid-cols-2 gap-8">
                <div>
                    <label class="block text-sm font-medium mb-2">Nombre NFT</label>
                    <input id="nftName" type="text" placeholder="Mi IA Gato #001" class="w-full p-4 bg-white/20 rounded-xl border border-white/30">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-2">Descripción</label>
                    <textarea id="nftDesc" placeholder="Gato astronauta generado con IA" rows="3" class="w-full p-4 bg-white/20 rounded-xl border border-white/30"></textarea>
                </div>
            </div>
            
            <div class="flex gap-4 mt-8">
                <button id="mintBtn" class="flex-1 bg-gradient-to-r from-purple-500 to-pink-600 hover:from-purple-600 hover:to-pink-700 px-8 py-4 rounded-xl font-bold text-lg transition-all duration-300 disabled:opacity-50">
                    🪙 Mintear NFT (Devnet)
                </button>
                <button id="viewExplorer" class="bg-gray-600 hover:bg-gray-500 px-8 py-4 rounded-xl font-bold transition-all duration-300 hidden">
                    🌐 Ver en Explorer
                </button>
            </div>
            
            <div id="mintResult" class="mt-8 p-6 bg-green-500/20 rounded-xl hidden">
                <h3 class="font-bold mb-2">¡NFT Creado!</h3>
                <p id="mintAddress"></p>
                <p id="txSignature" class="text-sm break-all"></p>
            </div>
        </section>
    </div>

    <script>
        // Configuración Stable Diffusion API (reemplaza con tu Colab URL)
        const SD_API_URL = 'https://nonexigent-missy-jocosely.ngrok-free.dev/api/generatenft'; // ¡Obtén esto de tu Colab!

        // Estado
        let currentImage = null; //En el estado inicial no se muestra ningún recuadro de imagen
        let wallet = null; //Para que el usuario pueda vincular la suya una vez se haya generado la imagen

        // Generar imagen
        document.getElementById('generateBtn').addEventListener('click', async () => {
            const btn = document.getElementById('generateBtn');
            btn.textContent = '⏳ Generando...';
            btn.disabled = true; //Para evitar problemas

            try {
                const payload = { //Lo que espera recibir como argumentos Google Colab
                    prompt: document.getElementById('prompt').value,
                    style: document.getElementById('style').value,
                    steps: parseInt(document.getElementById('steps').value)
                };

                const response = await fetch(SD_API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();
                const imageData = `data:image/png;base64,${data.images[0]}`; //La imagen devuelta desde Google Colab
                
                //Cuando recibimos la imagen, se muetsra el cuadro de imagen y nos dará la opción de vincular nuestra cuenta de Phantom para comenzar el Minteado
                currentImage = imageData;
                document.getElementById('generatedImg').src = imageData;
                document.getElementById('imageResult').classList.remove('hidden');
                document.getElementById('nftSection').classList.remove('hidden');
                
                // Auto-rellenar nombre/descripción (El usuario podrá cambiarla si quiere)
                document.getElementById('nftName').value = `IA Gen ${Date.now()}`;
                document.getElementById('nftDesc').value = `Imagen generada con prompt: ${payload.prompt}`;
                
            } catch (error) {
                alert('Error generando imagen. Verifica que tu Colab con API esté corriendo.');
                console.error(error);
            }

            btn.textContent = '🎨 Generar Imagen';
            btn.disabled = false; //Cuando se pulse el botón se deshabilita para evitar problemas
        });

        // Steps slider
        document.getElementById('steps').addEventListener('input', (e) => {
            document.getElementById('stepsValue').textContent = e.target.value;
        });

        // Conectar Wallet Phantom
        document.getElementById('connectWallet').addEventListener('click', async () => {
            if ('solana' in window) {
                try {
                    wallet = await window.solana.connect();
                    document.getElementById('walletStatus').textContent = `Conectado: ${wallet.publicKey.toString().slice(0,8)}...`;
                    document.getElementById('mintBtn').disabled = false;
                } catch (err) {
                    alert('Phantom no encontrado o cancelado');
                }
            } else {
                alert('Instala Phantom Wallet: https://phantom.app/');
            }
        });

        // Mint NFT (versión simplificada - usa devnet)
        document.getElementById('mintBtn').addEventListener('click', async () => {
            if (!wallet || !currentImage) return;

            const btn = document.getElementById('mintBtn');
            btn.textContent = '⏳ Minteando...';
            btn.disabled = true;

            try {
                // 1. Subir imagen a IPFS (simulado - usa nft.storage en prod)
                const imageFormData = new FormData();
                const imgBlob = await (await fetch(currentImage)).blob();
                imageFormData.append('image', imgBlob, 'ia-gen.png');
                
                // En prod: const imageRes = await fetch('https://api.nft.storage/v1/files', {method: 'POST', body: imageFormData});
                const imageUri = 'https://ipfs.io/ipfs/SIMULADO'; // Reemplaza
                
                // 2. Metadata JSON
                const metadata = {
                    name: document.getElementById('nftName').value,
                    description: document.getElementById('nftDesc').value,
                    image: imageUri,
                    attributes: [{ trait_type: 'IA', value: 'Stable Diffusion' }]
                };
                
                // En prod: subir metadata y obtener metadataUri
                
                // 3. Mint NFT (simulado - integra Metaplex Umi)
                const mintAddress = 'EjemploMint' + Date.now();
                const txSignature = 'EjemploTx' + Date.now();
                
                document.getElementById('mintAddress').textContent = `Mint: ${mintAddress}`;
                document.getElementById('txSignature').textContent = `Tx: ${txSignature}`;
                document.getElementById('mintResult').classList.remove('hidden');
                document.getElementById('viewExplorer').classList.remove('hidden');
                document.getElementById('viewExplorer').onclick = () => window.open(`https://explorer.solana.com/tx/${txSignature}?cluster=devnet`);
                
            } catch (error) {
                alert('Error minteando. Usa devnet primero.');
                console.error(error);
            }

            btn.textContent = '🪙 Mintear NFT (Devnet)';
            btn.disabled = false;
        });
    </script>
</body>
</html>
